<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Змейка</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #1a1a2e, #16213e);
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
a { color: #4fc3f7; text-decoration: none; }
a:hover { text-decoration: underline; }
.back { font-size: 0.9rem; margin-bottom: 8px; align-self: flex-start; }
h1 {
  font-size: 1.6rem;
  color: #fff;
  margin-bottom: 4px;
  text-shadow: 0 0 20px rgba(79,195,247,0.4);
  letter-spacing: 2px;
}
#score-display {
  font-size: 1.15rem;
  color: #f5d76e;
  margin-bottom: 10px;
  font-weight: 700;
  text-shadow: 0 0 10px rgba(245,215,110,0.3);
}
canvas {
  border: 2px solid rgba(79,195,247,0.6);
  border-radius: 12px;
  background: #0f3460;
  display: block;
  max-width: 100%;
  box-shadow: 0 0 30px rgba(79,195,247,0.15), inset 0 0 60px rgba(0,0,0,0.3);
}
.controls {
  display: grid;
  grid-template-areas:
    ". up ."
    "left down right";
  grid-template-columns: 70px 70px 70px;
  grid-template-rows: 70px 70px;
  gap: 6px;
  margin-top: 14px;
}
.ctrl-btn {
  width: 70px;
  height: 70px;
  border: 2px solid rgba(79,195,247,0.5);
  border-radius: 16px;
  background: linear-gradient(145deg, #1a2744, #16213e);
  color: #4fc3f7;
  font-size: 1.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.15s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
}
.ctrl-btn:active {
  background: linear-gradient(145deg, #4fc3f7, #29b6f6);
  color: #1a1a2e;
  transform: scale(0.93);
  box-shadow: 0 0 20px rgba(79,195,247,0.4);
}
.ctrl-up { grid-area: up; }
.ctrl-down { grid-area: down; }
.ctrl-left { grid-area: left; }
.ctrl-right { grid-area: right; }

#start-btn {
  margin-top: 16px;
  padding: 14px 44px;
  background: linear-gradient(135deg, #4fc3f7, #29b6f6);
  color: #1a1a2e;
  border: none;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(79,195,247,0.35);
  transition: all 0.2s ease;
  animation: pulse-btn 2s ease-in-out infinite;
  letter-spacing: 1px;
}
#start-btn:hover {
  background: linear-gradient(135deg, #29b6f6, #0288d1);
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(79,195,247,0.5);
}
@keyframes pulse-btn {
  0%, 100% { box-shadow: 0 4px 20px rgba(79,195,247,0.35); }
  50% { box-shadow: 0 4px 30px rgba(79,195,247,0.6); }
}

/* Модал GameOver */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.overlay.show { display: flex; }
.overlay.show .modal {
  animation: modal-in 0.3s ease-out;
}
@keyframes modal-in {
  from { opacity: 0; transform: scale(0.85) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal {
  background: linear-gradient(145deg, rgba(22,33,62,0.95), rgba(15,52,96,0.9));
  border: 1px solid rgba(79,195,247,0.4);
  border-radius: 20px;
  padding: 32px 28px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(79,195,247,0.1);
}
.modal h2 {
  color: #f5d76e;
  margin-bottom: 4px;
  font-size: 1.3rem;
  text-shadow: 0 0 15px rgba(245,215,110,0.3);
}
.modal .final-score {
  font-size: 2.8rem;
  color: #fff;
  font-weight: 800;
  margin-bottom: 20px;
  text-shadow: 0 0 20px rgba(255,255,255,0.2);
}
.modal input {
  width: 100%;
  padding: 12px;
  border: 2px solid rgba(79,195,247,0.4);
  border-radius: 10px;
  background: rgba(15,52,96,0.6);
  color: #fff;
  font-size: 1rem;
  text-align: center;
  margin-bottom: 12px;
  outline: none;
  transition: border-color 0.2s;
}
.modal input:focus { border-color: #4fc3f7; box-shadow: 0 0 15px rgba(79,195,247,0.2); }
.modal input::placeholder { color: #556; }
.modal button {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #4fc3f7, #29b6f6);
  color: #1a1a2e;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 15px rgba(79,195,247,0.3);
}
.modal button:hover {
  background: linear-gradient(135deg, #29b6f6, #0288d1);
  box-shadow: 0 4px 20px rgba(79,195,247,0.5);
}

/* Таблица лидеров */
.leaderboard {
  margin-top: 28px;
  width: 100%;
  max-width: 360px;
  background: linear-gradient(145deg, rgba(22,33,62,0.5), rgba(15,52,96,0.3));
  border: 1px solid rgba(79,195,247,0.15);
  border-radius: 16px;
  padding: 20px 16px;
}
.leaderboard h3 {
  text-align: center;
  color: #f5d76e;
  margin-bottom: 14px;
  font-size: 1.1rem;
  text-shadow: 0 0 10px rgba(245,215,110,0.2);
  letter-spacing: 1px;
}
.lb-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 3px;
}
.lb-table th {
  background: rgba(15,52,96,0.6);
  padding: 8px 10px;
  font-size: 0.8rem;
  color: #6688aa;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  border-bottom: 1px solid rgba(79,195,247,0.1);
}
.lb-table th:first-child { border-radius: 8px 0 0 8px; }
.lb-table th:last-child { border-radius: 0 8px 8px 0; }
.lb-table td {
  padding: 9px 10px;
  font-size: 0.95rem;
  background: rgba(22,33,62,0.3);
}
.lb-table td:first-child { border-radius: 6px 0 0 6px; }
.lb-table td:last-child { border-radius: 0 6px 6px 0; }
.lb-table .rank { text-align: center; width: 40px; }
.lb-table .pts { text-align: right; font-weight: 700; color: #4fc3f7; }

/* 1 место */
.lb-table tr.top-1 td {
  color: #ffd700;
  font-weight: 700;
  font-size: 1.05rem;
  background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,180,0,0.05));
  border-top: 1px solid rgba(255,215,0,0.4);
  border-bottom: 1px solid rgba(255,215,0,0.4);
  text-shadow: 0 0 8px rgba(255,215,0,0.3);
}
.lb-table tr.top-1 td:first-child { border-left: 1px solid rgba(255,215,0,0.4); border-radius: 8px 0 0 8px; }
.lb-table tr.top-1 td:last-child { border-right: 1px solid rgba(255,215,0,0.4); border-radius: 0 8px 8px 0; }
.lb-table tr.top-1 .pts { color: #ffd700; }

/* 2 место */
.lb-table tr.top-2 td {
  color: #d0d0d0;
  font-weight: 600;
  background: rgba(192,192,192,0.06);
}
.lb-table tr.top-2 .pts { color: #c0c0c0; }

/* 3 место */
.lb-table tr.top-3 td {
  color: #cd7f32;
  font-weight: 600;
  background: rgba(205,127,50,0.06);
}
.lb-table tr.top-3 .pts { color: #cd7f32; }
.lb-empty { text-align: center; color: #556; font-style: italic; padding: 20px; }

/* Выбор скина */
.skins-toggle {
  margin-top: 12px;
  background: rgba(79,195,247,0.08);
  border: 1px solid rgba(79,195,247,0.4);
  color: #4fc3f7;
  border-radius: 10px;
  padding: 8px 22px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
}
.skins-toggle:hover { background: rgba(79,195,247,0.15); box-shadow: 0 0 15px rgba(79,195,247,0.15); }
.skins-panel {
  display: none;
  margin-top: 10px;
  width: 100%;
  max-width: 320px;
}
.skins-panel.open { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.skin-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 12px;
  border: 2px solid rgba(26,26,62,0.8);
  border-radius: 12px;
  background: linear-gradient(145deg, #1a2744, #16213e);
  cursor: pointer;
  transition: all 0.2s ease;
  width: 72px;
}
.skin-card:hover { transform: scale(1.08); border-color: rgba(79,195,247,0.3); }
.skin-card.active {
  border-color: #4fc3f7;
  box-shadow: 0 0 15px rgba(79,195,247,0.3);
  background: linear-gradient(145deg, #1e2f52, #16213e);
}
.skin-preview { display: flex; gap: 2px; }
.skin-preview span {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  display: block;
  box-shadow: 0 0 4px rgba(0,0,0,0.3);
}
.skin-label { font-size: 0.7rem; color: #8899aa; text-align: center; }
.modal .name-error {
  color: #ff6b6b;
  font-size: 0.85rem;
  margin-bottom: 10px;
  display: none;
  text-shadow: 0 0 10px rgba(255,107,107,0.3);
}
.modal .name-error.show {
  display: block;
  animation: shake 0.4s ease;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

/* Десктоп */
@media (min-width: 768px) {
  body { padding: 20px 40px; }
  .game-wrapper {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    max-width: 900px;
    margin-top: 8px;
  }
  .game-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 2rem; margin-bottom: 6px; }
  #score-display { font-size: 1.3rem; margin-bottom: 12px; }
  canvas { max-width: none; }
  .controls { display: none !important; }
  #start-btn {
    padding: 16px 52px;
    font-size: 1.2rem;
    border-radius: 14px;
  }
  .skins-toggle { font-size: 0.95rem; padding: 9px 24px; }
  .skins-panel { max-width: 400px; }
  .leaderboard {
    max-width: 380px;
    min-width: 320px;
    margin-top: 0;
  }
  .leaderboard h3 { font-size: 1.2rem; }
  .lb-table td { font-size: 1rem; padding: 10px 12px; }
  .lb-table th { font-size: 0.85rem; padding: 9px 12px; }
  .modal { max-width: 380px; padding: 36px 32px; }
  .modal h2 { font-size: 1.5rem; }
  .modal .final-score { font-size: 3.2rem; }
  .modal input { padding: 14px; font-size: 1.05rem; }
  .modal button { padding: 14px; font-size: 1.05rem; }
  .kb-hint {
    display: block;
    margin-top: 12px;
    color: #556;
    font-size: 0.8rem;
    text-align: center;
  }
}
@media (max-width: 767px) {
  .game-wrapper {
    display: contents;
  }
  .game-col {
    display: contents;
  }
  .kb-hint { display: none; }
}
</style>
<script src="badwords.js"></script>
</head>
<body>

<div class="back"><a href="index.html">&larr; Расписание</a></div>
<h1>Змейка</h1>
<div id="score-display">Очки: 0</div>

<div class="game-wrapper">
  <div class="game-col">
    <canvas id="game"></canvas>

    <button id="start-btn">Играть</button>

    <button class="skins-toggle" id="skins-toggle">Расцветка</button>
    <div class="skins-panel" id="skins-panel"></div>

    <div class="controls" id="controls" style="display:none;">
      <div class="ctrl-btn ctrl-up" data-dir="up">&#9650;</div>
      <div class="ctrl-btn ctrl-left" data-dir="left">&#9664;</div>
      <div class="ctrl-btn ctrl-down" data-dir="down">&#9660;</div>
      <div class="ctrl-btn ctrl-right" data-dir="right">&#9654;</div>
    </div>

    <div class="kb-hint">WASD / стрелки для управления</div>
  </div>

  <div class="leaderboard">
    <h3>Таблица лидеров</h3>
    <div id="lb-body"></div>
  </div>
</div>

<div class="overlay" id="gameover-overlay">
  <div class="modal">
    <h2>Игра окончена!</h2>
    <div class="final-score" id="final-score">0</div>
    <input type="text" id="player-name" placeholder="Ваше имя" maxlength="20" autocomplete="off">
    <div class="name-error" id="name-error"></div>
    <button id="save-btn">Сохранить результат</button>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzPfAYsmjlI1Gy1jb8H-c1u1QZMMBz5gDgwhxXJZEMJpNCo3p671Xl8imKHqPXv8-xa/exec';

const SKINS = {
  classic: {
    name: 'Классика',
    head: '#4fc3f7',
    body: ['#7dcea0']
  },
  rainbow: {
    name: 'Радуга',
    head: '#ff0000',
    body: ['#ff0000','#ff8c00','#ffd700','#32cd32','#00bfff','#4169e1','#9b59b6']
  },
  armenia: {
    name: 'Армения',
    head: '#d90012',
    body: ['#d90012','#0033a0','#f2a800']
  },
  russia: {
    name: 'Россия',
    head: '#ffffff',
    body: ['#ffffff','#0039a6','#d52b1e']
  }
};
let currentSkin = 'classic';

const isDesktop = window.matchMedia('(min-width: 768px)').matches;
const CELL = isDesktop ? 28 : 20;
const COLS = 15;
const ROWS = 20;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

let snake, dir, nextDir, food, score, gameInterval, running;

function init() {
  const midX = Math.floor(COLS / 2);
  const midY = Math.floor(ROWS / 2);
  snake = [
    { x: midX, y: midY },
    { x: midX - 1, y: midY },
    { x: midX - 2, y: midY }
  ];
  dir = 'right';
  nextDir = 'right';
  score = 0;
  updateScore();
  placeFood();
  draw();
}

function placeFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function draw() {
  // Фон
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Сетка (тонкая)
  ctx.strokeStyle = 'rgba(79,195,247,0.07)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
  }

  // Еда — свечение
  ctx.shadowColor = '#f5d76e';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#f5d76e';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Змейка
  const skin = SKINS[currentSkin];
  snake.forEach((seg, i) => {
    if (i === 0) {
      ctx.fillStyle = skin.head;
      ctx.shadowColor = skin.head;
      ctx.shadowBlur = 8;
    } else {
      const colors = skin.body;
      ctx.fillStyle = colors[(i - 1) % colors.length];
      ctx.shadowBlur = 0;
    }
    ctx.beginPath();
    ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
}

function updateScore() {
  document.getElementById('score-display').textContent = 'Очки: ' + score;
}

function step() {
  dir = nextDir;
  const head = { ...snake[0] };

  if (dir === 'up') head.y--;
  else if (dir === 'down') head.y++;
  else if (dir === 'left') head.x--;
  else if (dir === 'right') head.x++;

  // Стены
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();

  // Столкновение с собой
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    updateScore();
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function gameOver() {
  running = false;
  clearInterval(gameInterval);
  document.getElementById('final-score').textContent = score;
  document.getElementById('gameover-overlay').classList.add('show');
  document.getElementById('player-name').focus();
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('controls').style.display = 'none';
}

function setDir(d) {
  if (!running) return;
  const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
  if (d !== opposite[dir]) nextDir = d;
}

// Кнопки управления
document.querySelectorAll('.ctrl-btn').forEach(btn => {
  btn.addEventListener('touchstart', e => { e.preventDefault(); setDir(btn.dataset.dir); });
  btn.addEventListener('mousedown', e => { e.preventDefault(); setDir(btn.dataset.dir); });
});

// Клавиатура
document.addEventListener('keydown', e => {
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                w: 'up', s: 'down', a: 'left', d: 'right' };
  if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
});

// Старт
document.getElementById('start-btn').addEventListener('click', () => {
  init();
  running = true;
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('controls').style.display = 'grid';
  clearInterval(gameInterval);
  gameInterval = setInterval(step, 170);
});

// Сохранение результата
document.getElementById('save-btn').addEventListener('click', saveResult);
document.getElementById('player-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveResult();
});

function normalizeName(str) {
  // Латиница -> кириллица (похожие буквы)
  const lat2cyr = {a:'а',b:'б',c:'с',e:'е',h:'н',k:'к',m:'м',o:'о',p:'р',t:'т',x:'х',y:'у',i:'и',u:'у',d:'д',n:'н',r:'р',l:'л',w:'ш',v:'в',g:'г',z:'з',f:'ф',j:'й',q:'к'};
  let s = str.toLowerCase();
  // Удаляем спецсимволы, цифры, пробелы — оставляем только буквы
  s = s.replace(/[^a-zа-яёa-zа-яё]/gi, '');
  // Заменяем латинские на кириллицу
  s = s.split('').map(c => lat2cyr[c] || c).join('');
  return s;
}

function saveResult() {
  const input = document.getElementById('player-name');
  const errorEl = document.getElementById('name-error');
  const name = input.value.trim() || 'Аноним';

  // Проверка на мат/оскорбления
  if (name !== 'Аноним') {
    const normalized = normalizeName(name);
    const lower = name.toLowerCase();
    // Проверяем и оригинал, и нормализованную версию
    const found = window.BADWORDS.find(w => {
      const nw = normalizeName(w);
      return lower.includes(w) || normalized.includes(nw);
    });
    if (found) {
      errorEl.textContent = 'Сам ты "' + found + '"! Введи нормальное имя.';
      errorEl.classList.add('show');
      input.value = '';
      input.focus();
      return;
    }
  }

  errorEl.classList.remove('show');
  document.getElementById('gameover-overlay').classList.remove('show');
  input.value = '';
  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ name, score }),
  }).then(() => renderLeaderboard()).catch(() => renderLeaderboard());
}

function renderLeaderboard() {
  const el = document.getElementById('lb-body');
  el.innerHTML = '<div class="lb-empty">Загрузка...</div>';
  fetch(API_URL)
    .then(r => r.json())
    .then(lb => {
      if (!lb.length) { el.innerHTML = '<div class="lb-empty">Пока нет результатов. Будь первым!</div>'; return; }
      const medals = ['\u{1F451}', '\u{1F948}', '\u{1F949}'];
      let html = '<table class="lb-table"><tr><th class="rank">#</th><th class="name">Имя</th><th class="pts">Очки</th></tr>';
      lb.forEach((r, i) => {
        const cls = i < 3 ? ` class="top-${i + 1}"` : '';
        const rank = medals[i] || (i + 1);
        html += `<tr${cls}><td class="rank">${rank}</td><td class="name">${esc(r.name)}</td><td class="pts">${r.score}</td></tr>`;
      });
      html += '</table>';
      el.innerHTML = html;
    })
    .catch(() => { el.innerHTML = '<div class="lb-empty">Ошибка загрузки</div>'; });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Скины
function renderSkins() {
  const panel = document.getElementById('skins-panel');
  panel.innerHTML = '';
  for (const [key, skin] of Object.entries(SKINS)) {
    const card = document.createElement('div');
    card.className = 'skin-card' + (key === currentSkin ? ' active' : '');
    const preview = skin.body.slice(0, 5).map(c => `<span style="background:${c}"></span>`).join('');
    card.innerHTML = `<div class="skin-preview">${preview}</div><div class="skin-label">${skin.name}</div>`;
    card.addEventListener('click', () => {
      currentSkin = key;
      renderSkins();
      draw();
    });
    panel.appendChild(card);
  }
}

document.getElementById('skins-toggle').addEventListener('click', () => {
  document.getElementById('skins-panel').classList.toggle('open');
});

renderSkins();

// Инициализация
init();
renderLeaderboard();
</script>
</body>
</html>
