<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — ДЗ</title>
<script>
(() => {
  const savedTheme = localStorage.getItem('schedule-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = savedTheme || (prefersDark ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
})();
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
*,
*::before,
*::after {
  box-shadow: none !important;
  text-shadow: none !important;
}

:root {
  --bg: #f3f6fb;
  --surface: #fdfefe;
  --surface-strong: #ffffff;
  --surface-2: #eef3f9;
  --border: #d6deea;
  --shadow: 0 14px 42px rgba(16, 24, 40, 0.08);
  --accent: #2563eb;
  --accent-strong: #1d4ed8;
  --accent-soft: #dbeafe;
  --text: #101828;
  --text-muted: #64748b;
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.12);
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #111827;
  --surface-strong: #172033;
  --surface-2: #0f172a;
  --border: #2b374d;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
  --accent: #60a5fa;
  --accent-strong: #93c5fd;
  --accent-soft: rgba(96, 165, 250, 0.16);
  --text: #e5e7eb;
  --text-muted: #94a3b8;
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);
  color-scheme: dark;
}

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 54%, transparent), transparent 360px),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 14px clamp(12px, 2.5vw, 32px) 40px;
}

/* ── Nav ── */
nav {
  display: flex;
  justify-content: flex-start;
  gap: 8px;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto 16px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  box-shadow: var(--shadow);
}
nav a {
  flex: 1;
  min-height: 42px;
  padding: 0 12px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-muted);
  text-align: center;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
}
nav a:hover { color: var(--accent); }
nav a.active { background: var(--accent); color: #fff; }

/* ── Auth ── */
#auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
}
#auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 28px;
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow);
}
#auth-card h2 { color: var(--text); font-size: 1.2rem; text-align: center; }
#auth-error { min-height: 18px; font-size: 0.85rem; color: var(--danger); text-align: center; }
.shake { animation: shake 0.35s ease; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%,60%  { transform: translateX(-7px); }
  40%,80%  { transform: translateX(7px); }
}

/* ── Inputs ── */
input[type=password], input[type=date], input[type=text],
textarea, select {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 0.92rem;
  font-family: inherit;
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
select option { background: var(--surface); }
textarea { resize: vertical; }

/* ── Buttons ── */
.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s, transform 0.15s;
  box-shadow: 0 12px 28px rgba(37, 99, 235, 0.22);
}
.btn:hover { background: var(--accent-strong); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-sm {
  background: var(--danger-soft);
  border: 1px solid color-mix(in srgb, var(--danger) 38%, transparent);
  color: var(--danger);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn-sm:hover { background: var(--danger); color: #fff; }
.btn-logout {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 0.82rem;
  cursor: pointer;
}
.btn-logout:hover { border-color: var(--accent); color: var(--accent); }

/* ── Panel ── */
#panel { display: none; max-width: 760px; margin: 0 auto; }
.panel-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.panel-top h1 { color: var(--text); font-size: clamp(1.35rem, 3vw, 1.75rem); }

/* ── Add card ── */
.add-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 22px;
  box-shadow: var(--shadow);
}
.add-card h2 { color: var(--text); font-size: 1rem; margin-bottom: 16px; }
.form-group { margin-bottom: 12px; }
.form-group label {
  display: block;
  font-size: 0.75rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 5px;
}
.form-row { display: grid; grid-template-columns: 1fr 150px; gap: 10px; }
.dates-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#save-status { text-align: center; font-size: 0.85rem; color: var(--accent); min-height: 22px; margin-top: 8px; }

/* ── HW list ── */
.section-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  margin-bottom: 12px;
  font-weight: 600;
}
.day-group { margin-bottom: 20px; }
.day-group-hdr {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.hw-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 13px 14px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.hw-row-info { flex: 1; min-width: 0; }
.hw-row-head {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 3px;
}
.hw-row-subject { font-weight: 700; color: var(--text); font-size: 0.92rem; }
.hw-row-group {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  border-radius: 999px;
  color: var(--accent);
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 1;
  padding: 4px 7px;
}
.hw-row-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.45; overflow-wrap: anywhere; }
.hw-row-meta { font-size: 0.73rem; color: color-mix(in srgb, var(--text-muted) 72%, transparent); margin-top: 5px; }
.list-empty {
  text-align: center;
  color: var(--text-muted);
  border: 1px dashed var(--border);
  border-radius: 8px;
  padding: 30px;
  font-size: 0.9rem;
}
#past-wrap { text-align: center; margin-top: 16px; }
#past-wrap label { font-size: 0.85rem; color: var(--text-muted); cursor: pointer; gap: 8px; display: inline-flex; align-items: center; }
#past-wrap input { accent-color: var(--accent); }

@media (max-width: 520px) {
  body { padding: 10px 10px 34px; }
  nav { margin-bottom: 14px; }
  .panel-top { align-items: flex-start; }
  .form-row,
  .dates-row { grid-template-columns: 1fr; gap: 0; }
  .add-card { padding: 16px; }
  .hw-row { padding: 12px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html?v=4">Расписание</a>
  <a href="admin.html?v=4" class="active">Админка</a>
</nav>

<!-- Auth -->
<div id="auth-screen">
  <div id="auth-card">
    <h2>Вход в админку</h2>
    <div id="auth-error"></div>
    <input type="password" id="pwd" placeholder="Пароль" autocomplete="current-password">
    <button class="btn" onclick="tryLogin()">Войти</button>
  </div>
</div>

<!-- Panel -->
<div id="panel">
  <div class="panel-top">
    <h1>Домашние задания</h1>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>

  <div class="add-card">
    <h2>Новое задание</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Предмет</label>
        <select id="f-subject" onchange="onSubjectChange()">
          <option value="">— выбрать —</option>
          <option>МГ</option><option>ФКХ</option><option>ПАТ</option>
          <option>МФА</option><option>ГИГ</option><option>МБХ</option>
          <option>БОТ</option><option>ХПФ</option><option>ПДвФ</option>
          <option>ОФХ</option><option>ФР</option><option>ФКС</option>
        </select>
      </div>
      <div class="form-group">
        <label>Группа</label>
        <select id="f-group">
          <option value="">— выбрать —</option>
          <option value="1">1 группа</option>
          <option value="2">2 группа</option>
          <option value="3">3 группа</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Задание</label>
      <textarea id="f-text" rows="3" placeholder="Текст задания"></textarea>
    </div>
    <div class="dates-row">
      <div class="form-group">
        <label>Дата пары</label>
        <input type="date" id="f-lesson-date">
      </div>
      <div class="form-group">
        <label>Дедлайн</label>
        <input type="date" id="f-deadline">
      </div>
    </div>
    <button class="btn" id="add-btn" onclick="addHw()">Добавить</button>
    <div id="save-status"></div>
  </div>

  <div class="section-label">Активные задания</div>
  <div id="hw-list"><div class="list-empty">Загрузка...</div></div>
  <div id="past-wrap">
    <label>
      <input type="checkbox" id="show-past" onchange="renderList()">
      Показать прошедшие
    </label>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwuSrAb4aoI79yMefk-bOemFjprKlbZd1yP7f1KgDr3Clc0aUTvjPEXDA1WTojnig9bdQ/exec';
const PWD_HASH   = '51a9f2e1e7d282d8d2b41cf3848f13e94375650b808cb8ca09d2f992423041df';

const SUBJECT_WD = {
  'МФА':1,'ГИГ':1,'ФКХ':2,'БОТ':2,
  'ОФХ':3,'ПАТ':3,'ФКС':3,
  'ФР':4,'ХПФ':4,'ПДвФ':4,'МБХ':5,'МГ':5
};
const WD_NAMES = ['вс','пн','вт','ср','чт','пт','сб'];
let allHw = [];

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function tryLogin() {
  const hash = await sha256(document.getElementById('pwd').value);
  if (hash === PWD_HASH) {
    sessionStorage.setItem('admin_ok', '1');
    showPanel();
  } else {
    const card = document.getElementById('auth-card');
    document.getElementById('auth-error').textContent = 'Неверный пароль';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
}
document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
function logout() { sessionStorage.removeItem('admin_ok'); location.reload(); }
function showPanel() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadHw();
}
if (sessionStorage.getItem('admin_ok') === '1') showPanel();

function toISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseToISO(str) {
  if (!str) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  const d = new Date(str);
  return isNaN(d.getTime()) ? str : toISO(d);
}
function fmtISO(iso) {
  const d = new Date(iso + 'T00:00:00');
  return String(d.getDate()).padStart(2,'0') + '.' +
    String(d.getMonth()+1).padStart(2,'0') + '.' +
    d.getFullYear() + ' (' + WD_NAMES[d.getDay()] + ')';
}
function getNextDate(subject) {
  const today = new Date(); today.setHours(0,0,0,0);
  const targetWd = SUBJECT_WD[subject];
  if (targetWd === undefined) return today;
  const d = new Date(today);
  let ahead = targetWd - d.getDay();
  if (ahead < 0) ahead += 7;
  d.setDate(d.getDate() + ahead);
  return d;
}
function onSubjectChange() {
  const sub = document.getElementById('f-subject').value;
  if (!sub) return;
  const iso = toISO(getNextDate(sub));
  document.getElementById('f-lesson-date').value = iso;
  document.getElementById('f-deadline').value = iso;
}

async function loadHw() {
  try {
    const res  = await fetch(SCRIPT_URL + '?action=list');
    const json = await res.json();
    allHw = (json.data || []).map(h => ({
      ...h,
      lesson_date: parseToISO(h.lesson_date),
      deadline:    parseToISO(h.deadline),
      created_at:  parseToISO(h.created_at),
    }));
    renderList();
  } catch (e) {
    document.getElementById('hw-list').innerHTML =
      `<div class="list-empty" style="color:#ef4444">Ошибка загрузки: ${e.message}</div>`;
  }
}

async function addHw() {
  const subject     = document.getElementById('f-subject').value;
  const group       = document.getElementById('f-group').value;
  const text        = document.getElementById('f-text').value.trim();
  const lesson_date = document.getElementById('f-lesson-date').value;
  const deadline    = document.getElementById('f-deadline').value;
  if (!subject || !group || !text || !lesson_date || !deadline) { setStatus('Заполни все поля','#ef4444'); return; }
  const btn = document.getElementById('add-btn');
  btn.disabled = true; setStatus('Сохранение...');
  try {
    const url = SCRIPT_URL + '?action=add' +
      '&subject=' + encodeURIComponent(subject) +
      '&group=' + encodeURIComponent(group) +
      '&groups=' + encodeURIComponent(group) +
      '&text=' + encodeURIComponent(text) +
      '&lesson_date=' + encodeURIComponent(lesson_date) +
      '&deadline=' + encodeURIComponent(deadline);
    const res = await fetch(url);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'ошибка');
    setStatus('Сохранено','#2563eb');
    ['f-subject','f-group','f-text','f-lesson-date','f-deadline'].forEach(id => document.getElementById(id).value = '');
    await loadHw();
  } catch (e) {
    setStatus('Ошибка: ' + e.message, '#ef4444');
  } finally {
    btn.disabled = false;
  }
}

async function deleteHw(id) {
  if (!confirm('Удалить задание?')) return;
  try {
    const res  = await fetch(SCRIPT_URL + '?action=delete&id=' + encodeURIComponent(id));
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    await loadHw();
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function setStatus(msg, color) {
  const el = document.getElementById('save-status');
  el.textContent = msg; el.style.color = color || '#2563eb';
  if (msg === 'Сохранено') setTimeout(() => { el.textContent = ''; }, 2000);
}

function getHomeworkGroup(hw) {
  return hw.group ?? hw.groups ?? hw.group_id ?? hw.groupId ?? hw.hw_group ?? hw.hwGroup ?? '';
}

function renderList() {
  const showPast = document.getElementById('show-past').checked;
  const today    = toISO(new Date());
  const hw       = showPast ? allHw : allHw.filter(h => h.deadline >= today);
  const listEl   = document.getElementById('hw-list');
  if (!hw.length) { listEl.innerHTML = '<div class="list-empty">Нет заданий</div>'; return; }
  const byDate = {};
  hw.forEach(h => { if (!byDate[h.deadline]) byDate[h.deadline] = []; byDate[h.deadline].push(h); });
  listEl.innerHTML = '';
  Object.keys(byDate).sort().forEach(date => {
    const group = document.createElement('div');
    group.className = 'day-group';
    const hdr = document.createElement('div');
    hdr.className = 'day-group-hdr';
    hdr.textContent = fmtISO(date);
    group.appendChild(hdr);
    byDate[date].forEach(hw => {
      const row = document.createElement('div');
      row.className = 'hw-row';
      const hwGroup = getHomeworkGroup(hw);
      row.innerHTML = `
        <div class="hw-row-info">
          <div class="hw-row-head">
            <div class="hw-row-subject">${hw.subject}</div>
            ${hwGroup ? `<span class="hw-row-group">${hwGroup} группа</span>` : ''}
          </div>
          <div class="hw-row-text">${hw.text}</div>
          <div class="hw-row-meta">пара: ${hw.lesson_date ? fmtISO(hw.lesson_date) : '—'}</div>
        </div>
        <button class="btn-sm" onclick="deleteHw('${hw.id}')">✕</button>`;
      group.appendChild(row);
    });
    listEl.appendChild(group);
  });
}
</script>
</body>
</html>
