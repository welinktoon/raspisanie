<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание занятий</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 24px;
    font-size: 1.6rem;
    color: #fff;
  }
  .week {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .day {
    background: #16213e;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .day:hover { transform: translateY(-4px); }
  .day.today { box-shadow: 0 0 0 2px #4fc3f7, 0 4px 20px rgba(79,195,247,0.3); }
  .day-header {
    padding: 10px;
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.5px;
  }
  .day-header.mon { background: #e8a87c; color: #333; }
  .day-header.tue { background: #f5d76e; color: #333; }
  .day-header.wed { background: #7dcea0; color: #333; }
  .day-header.thu { background: #85c1e9; color: #333; }
  .day-header.fri { background: #c39bd3; color: #333; }
  .lesson {
    padding: 12px 14px;
    border-bottom: 1px solid #1a1a3e;
  }
  .lesson:last-child { border-bottom: none; }
  .lesson-time {
    font-size: 0.82rem;
    color: #8899aa;
    margin-bottom: 4px;
  }
  .lesson-name {
    font-weight: 700;
    font-size: 1rem;
    color: #fff;
  }
  .lesson-room {
    font-size: 0.85rem;
    color: #6dbfb8;
    margin-top: 2px;
  }
  .lesson.active {
    background: rgba(79, 195, 247, 0.12);
    border-left: 3px solid #4fc3f7;
  }
  .badge-now {
    display: inline-block;
    background: #4fc3f7;
    color: #1a1a2e;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .no-classes {
    padding: 30px 14px;
    text-align: center;
    color: #556;
    font-style: italic;
  }
  #clock {
    text-align: center;
    margin-bottom: 4px;
    font-size: 0.9rem;
    color: #8899aa;
  }
  #week-range {
    text-align: center;
    margin-bottom: 12px;
    font-size: 0.85rem;
    color: #6dbfb8;
  }
  .day-date {
    display: block;
    font-size: 0.8rem;
    font-weight: 400;
    opacity: 0.8;
  }
  #status {
    max-width: 500px;
    margin: 0 auto 20px;
    background: #16213e;
    border-radius: 12px;
    padding: 16px 20px;
  }
  #status:empty { display: none; }
  .status-current { margin-bottom: 12px; }
  .status-label {
    font-size: 0.78rem;
    color: #8899aa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .status-pair {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
  }
  .status-pair .room {
    font-weight: 400;
    color: #6dbfb8;
    font-size: 0.9rem;
    margin-left: 6px;
  }
  .status-elapsed {
    font-size: 0.82rem;
    color: #8899aa;
    margin-top: 2px;
  }
  .progress-wrap {
    background: #0f3460;
    border-radius: 6px;
    height: 8px;
    margin-top: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    border-radius: 6px;
    background: linear-gradient(90deg, #4fc3f7, #29b6f6);
    transition: width 1s linear;
  }
  .status-next {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #1a1a3e;
  }
  .status-next-text {
    font-size: 0.9rem;
    color: #c0c0c0;
  }
  .status-next-text strong { color: #fff; }
  .status-next-text .time-left { color: #f5d76e; font-weight: 600; }
  .status-free {
    text-align: center;
    color: #7dcea0;
    font-size: 0.95rem;
  }
  @media (max-width: 768px) {
    .week {
      grid-template-columns: 1fr;
      max-width: 420px;
    }
    .day { margin-bottom: 4px; }
    .day:not(.today) .lesson { display: none; }
    .day:not(.today) .day-header::after {
      content: ' (нажмите)';
      font-weight: 400;
      font-size: 0.8rem;
      opacity: 0.7;
    }
    .day.expanded .lesson { display: block; }
    .day.expanded .day-header::after { content: ''; }
  }
</style>
</head>
<body>

<h1>Расписание занятий</h1>
<div id="clock"></div>
<div id="week-range"></div>
<div id="status"></div>

<div class="week" id="week"></div>

<script>
// Лекции в Я208 — даты по предметам (DD.MM.2026)
const lectures = {
  1: { // Понедельник 8:30
    time: '8:30–10:00', room: 'Я208',
    subjects: [
      { name: 'МГ (лекция)', dates: ['09.02','02.03','16.03','06.04','20.04','04.05','18.05'] },
      { name: 'ФКХ (лекция)', dates: ['16.02','09.03','23.03','13.04','27.04','11.05','25.05'] },
      { name: 'ПАТ (лекция)', dates: ['30.03'] }
    ]
  },
  2: { // Вторник 9:10
    time: '9:10–10:40', room: 'Я208',
    subjects: [
      { name: 'МФА (лекция)', dates: ['10.02','24.02','03.03','17.03','31.03','14.04','28.04','12.05','19.05','26.05'] },
      { name: 'ГИГ (лекция)', dates: ['17.02','10.03','24.03','07.04','21.04','05.05'] }
    ]
  },
  3: { // Среда 9:10
    time: '9:10–10:40', room: 'Я208',
    subjects: [
      { name: 'МБХ (лекция)', dates: ['11.02','25.02','11.03','25.03','08.04','22.04','06.05'] },
      { name: 'БОТ (лекция)', dates: ['18.02','04.03','18.03','01.04','15.04','29.04','13.05'] }
    ]
  },
  4: { // Четверг 9:10
    time: '9:10–10:40', room: 'Я208',
    subjects: [
      { name: 'ХПФ (лекция)', dates: ['12.02','26.02','12.03','26.03','09.04','23.04','07.05'] },
      { name: 'ПДвФ (лекция)', dates: ['19.02','05.03','19.03','02.04','16.04','30.04','14.05'] }
    ]
  },
  5: { // Пятница 9:10
    time: '9:10–10:40', room: 'Я208',
    subjects: [
      { name: 'ОФХ (лекция)', dates: ['20.02','06.03','20.03','10.04','24.04','08.05','15.05','22.05','29.05','05.06'] },
      { name: 'ПАТ (лекция)', dates: ['13.02','27.02','13.03','27.03','03.04','17.04'] }
    ]
  },
  '5b': { // Пятница 15:20 — вторая лекция
    time: '15:20–16:50', room: 'Я208',
    subjects: [
      { name: 'ФР (лекция)', dates: ['13.02','20.02','27.02','06.03','13.03','20.03','27.03','03.04','10.04','17.04','24.04'] }
    ]
  }
};

// Постоянные пары (группа 2) — каждую неделю
const fixedLessons = {
  1: [ // Понедельник
    { time: '10:30–12:45', name: 'МФА', room: 'Я112' },
    { time: '14:10–15:40', name: 'ГИГ', room: 'Дистант' }
  ],
  2: [ // Вторник
    { time: '11:10–12:40', name: 'ФКХ', room: 'А205' },
    { time: '13:10–14:40', name: 'БОТ', room: 'Комс-ая (3 эт)' }
  ],
  3: [ // Среда
    { time: '11:10–13:25', name: 'ОФХ', room: 'Я112' },
    { time: '14:10–16:25', name: 'ПАТ', room: 'Морф. 4эт. 2к' },
    { time: '16:50–18:20', name: 'ФКС', room: 'Стадион' }
  ],
  4: [ // Четверг
    { time: '11:10–13:25', name: 'ФР', room: 'Комс-ая (2 эт)' },
    { time: '14:10–15:40', name: 'ПДвФ', room: 'Я112' }
  ],
  5: [ // Пятница
    { time: '11:10–12:40', name: 'МБХ', room: 'А215' },
    { time: '13:30–15:00', name: 'МГ', room: 'Аптека' }
  ]
};

const dayNames = { 1: 'Понедельник', 2: 'Вторник', 3: 'Среда', 4: 'Четверг', 5: 'Пятница' };
const dayShorts = { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'fri', 5: 'fri' };
const dayShortMap = { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thu', 5: 'fri' };

function fmtDate(d) {
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return dd + '.' + mm;
}

function getDisplayWeekMonday(now) {
  const dow = now.getDay(); // 0=Sun, 6=Sat
  const d = new Date(now);
  if (dow === 0) { d.setDate(d.getDate() + 1); }
  else if (dow === 6) { d.setDate(d.getDate() + 2); }
  else { d.setDate(d.getDate() - (dow - 1)); }
  d.setHours(0, 0, 0, 0);
  return d;
}

function getLectureForDate(dayIdx, dateStr) {
  const lec = lectures[dayIdx];
  if (lec) {
    for (const s of lec.subjects) {
      if (s.dates.includes(dateStr)) return { time: lec.time, name: s.name, room: lec.room };
    }
  }
  return null;
}

function buildWeekSchedule(now) {
  const monday = getDisplayWeekMonday(now);
  const week = [];

  for (let i = 0; i < 5; i++) {
    const date = new Date(monday);
    date.setDate(monday.getDate() + i);
    const dayIdx = i + 1;
    const dateStr = fmtDate(date);
    const lessons = [];

    // Лекция 1 (утренняя)
    const lec1 = getLectureForDate(dayIdx, dateStr);
    if (lec1) lessons.push(lec1);

    // Постоянные пары
    if (fixedLessons[dayIdx]) {
      lessons.push(...fixedLessons[dayIdx]);
    }

    // Пятница — вторая лекция
    if (dayIdx === 5) {
      const lec2 = lectures['5b'];
      for (const s of lec2.subjects) {
        if (s.dates.includes(dateStr)) {
          lessons.push({ time: lec2.time, name: s.name, room: lec2.room });
          break;
        }
      }
    }

    // Сортировка по времени начала
    lessons.sort((a, b) => {
      const ta = parseTime(a.time.replace(/\u2013/g, '-').split('-')[0].trim());
      const tb = parseTime(b.time.replace(/\u2013/g, '-').split('-')[0].trim());
      return ta - tb;
    });

    const dd = date.getDate();
    const mmNames = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

    week.push({
      day: dayNames[dayIdx],
      short: dayShortMap[dayIdx],
      idx: dayIdx,
      date: date,
      dateLabel: dd + ' ' + mmNames[date.getMonth()],
      lessons: lessons
    });
  }
  return week;
}

function parseTime(s) {
  const [h, m] = s.split(':').map(Number);
  return h * 60 + m;
}

function getRange(timeStr) {
  const parts = timeStr.replace(/\u2013/g, '-').split('-');
  return { start: parseTime(parts[0].trim()), end: parseTime(parts[1].trim()) };
}

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function fmtMin(m) {
  const h = Math.floor(m / 60);
  const mm = m % 60;
  let s = '';
  if (h > 0) s += h + ' ' + plural(h, 'час', 'часа', 'часов');
  if (mm > 0) s += (s ? ' ' : '') + mm + ' ' + plural(mm, 'минуту', 'минуты', 'минут');
  return s || '< 1 минуты';
}

function renderStatus(todayData, nowMin) {
  const el = document.getElementById('status');
  if (!todayData || todayData.lessons.length === 0) { el.innerHTML = ''; return; }

  const lessons = todayData.lessons;
  let current = null, next = null;

  for (let i = 0; i < lessons.length; i++) {
    const r = getRange(lessons[i].time);
    if (nowMin >= r.start && nowMin < r.end) {
      current = { ...lessons[i], ...r, idx: i };
    }
    if (!next && nowMin < r.start) {
      next = { ...lessons[i], ...r, idx: i };
    }
  }

  const lastRange = getRange(lessons[lessons.length - 1].time);
  if (!current && nowMin >= lastRange.end) {
    el.innerHTML = '<div class="status-free">Пары на сегодня закончились</div>';
    return;
  }

  const firstRange = getRange(lessons[0].time);
  if (!current && nowMin < firstRange.start) {
    const left = firstRange.start - nowMin;
    el.innerHTML = `
      <div class="status-label">Первая пара через</div>
      <div class="status-next-text"><strong>${lessons[0].name}</strong> <span class="time-left">через ${fmtMin(left)}</span></div>
      <div class="status-elapsed">${lessons[0].time} / ${lessons[0].room}</div>
    `;
    return;
  }

  let html = '';
  if (current) {
    const elapsed = nowMin - current.start;
    const total = current.end - current.start;
    const pct = Math.min(100, Math.round(elapsed / total * 100));
    const remaining = total - elapsed;
    html += `
      <div class="status-current">
        <div class="status-label">Сейчас идет</div>
        <div class="status-pair">${current.name}<span class="room">${current.room}</span></div>
        <div class="status-elapsed">Прошло ${fmtMin(elapsed)} / осталось ${fmtMin(remaining)}</div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      </div>
    `;
    if (!next) {
      for (let i = current.idx + 1; i < lessons.length; i++) {
        const r = getRange(lessons[i].time);
        if (nowMin < r.start) { next = { ...lessons[i], ...r }; break; }
      }
    }
  }

  if (next) {
    const left = next.start - nowMin;
    html += `
      <div class="status-next">
        <div class="status-label">Следующая</div>
        <div class="status-next-text"><strong>${next.name}</strong> <span class="time-left">через ${fmtMin(left)}</span></div>
        <div class="status-elapsed">${next.time} / ${next.room}</div>
      </div>
    `;
  } else if (current) {
    html += `<div class="status-next"><div class="status-free">Последняя пара на сегодня</div></div>`;
  }

  el.innerHTML = html;
}

function render() {
  const now = new Date();
  const todayIdx = now.getDay();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const isWeekend = todayIdx === 0 || todayIdx === 6;

  const week = buildWeekSchedule(now);
  const weekEl = document.getElementById('week');
  weekEl.innerHTML = '';

  // Статус только для рабочего дня
  const todayData = isWeekend ? null : week.find(d => d.idx === todayIdx);
  renderStatus(todayData, nowMin);

  // Заголовок с диапазоном дат недели
  const weekLabel = week[0].dateLabel + ' – ' + week[4].dateLabel;
  document.getElementById('week-range').textContent =
    (isWeekend ? 'Следующая неделя: ' : 'Текущая неделя: ') + weekLabel;

  week.forEach(d => {
    const isToday = !isWeekend && d.idx === todayIdx;
    const dayEl = document.createElement('div');
    dayEl.className = 'day' + (isToday ? ' today' : '');
    dayEl.innerHTML = `<div class="day-header ${d.short}">${d.day}<span class="day-date">${d.dateLabel}</span></div>`;

    if (d.lessons.length === 0) {
      dayEl.innerHTML += '<div class="no-classes">Нет пар</div>';
    }

    d.lessons.forEach(l => {
      const r = getRange(l.time);
      const active = isToday && nowMin >= r.start && nowMin < r.end;
      const div = document.createElement('div');
      div.className = 'lesson' + (active ? ' active' : '');
      div.innerHTML = `
        <div class="lesson-time">${l.time}${active ? '<span class="badge-now">СЕЙЧАС</span>' : ''}</div>
        <div class="lesson-name">${l.name}</div>
        <div class="lesson-room">${l.room}</div>
      `;
      dayEl.appendChild(div);
    });

    dayEl.addEventListener('click', () => dayEl.classList.toggle('expanded'));
    weekEl.appendChild(dayEl);
  });

  document.getElementById('clock').textContent =
    now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }) +
    ', ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

render();
setInterval(render, 10000);
</script>

<div style="text-align:center; margin-top:32px; padding-bottom:24px;">
  <a href="snake.html" style="display:inline-block; padding:14px 32px; background:#4fc3f7; color:#1a1a2e; border-radius:10px; text-decoration:none; font-weight:700; font-size:1rem;">
    Змейка
  </a>
</div>
</body>
</html>
