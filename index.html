<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f5f5f5;
  --surface: #ffffff;
  --surface-strong: #ffffff;
  --surface-muted: #f1f1f1;
  --text: #111111;
  --muted: #6b7280;
  --border: #d8d8d8;
  --shadow: 0 14px 42px rgba(16, 24, 40, 0.08);
  --accent: #2563eb;
  --accent-strong: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --current: #2563eb;
  --current-strong: #1d4ed8;
  --current-soft: rgba(37, 99, 235, 0.06);
  --blue: #60a5fa;
  --yellow: #f59e0b;
  --rose: #d946ef;
  --mint: #38bdf8;
  --violet: #6366f1;
  --code: #111814;
  --code-text: #e8fff1;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1419;
  --surface: #16181c;
  --surface-strong: #1d2025;
  --surface-muted: #202327;
  --text: #f7f7f7;
  --muted: #a3a3a3;
  --border: #2f3336;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
  --accent: #60a5fa;
  --accent-strong: #93c5fd;
  --accent-soft: rgba(96, 165, 250, 0.1);
  --current: #60a5fa;
  --current-strong: #93c5fd;
  --current-soft: rgba(96, 165, 250, 0.08);
  --blue: #38bdf8;
  --yellow: #fbbf24;
  --rose: #e879f9;
  --mint: #7dd3fc;
  --violet: #a5b4fc;
  --code: #0a0f0c;
  --code-text: #e8fff1;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}

button,
a { -webkit-tap-highlight-color: transparent; }

button { font: inherit; }

button:focus-visible,
a:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset: 2px;
}

.app-shell {
  margin: 0 auto;
  max-width: 1440px;
  padding: 14px clamp(10px, 2.5vw, 32px) 32px;
}

.app-header {
  align-items: center;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(200px, auto) minmax(0, 1fr);
  padding: 12px;
  position: sticky;
  top: 10px;
  z-index: 20;
  backdrop-filter: blur(18px);
}

.brand {
  align-items: center;
  display: flex;
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  align-items: center;
  background: var(--accent);
  border-radius: 8px;
  color: #ffffff;
  display: inline-flex;
  font-weight: 900;
  height: 44px;
  justify-content: center;
  width: 44px;
}

.brand-mark [data-lucide],
.icon {
  height: 20px;
  stroke-width: 2.4;
  width: 20px;
}

.brand-title {
  display: block;
  font-size: 1rem;
  font-weight: 850;
  line-height: 1.2;
}

.brand-caption,
.eyebrow,
.section-title p,
.lesson-time,
.lesson-room,
.hw-subtitle,
.hw-text,
.no-hw,
.no-classes {
  color: var(--muted);
}

.group-picker {
  align-items: center;
  display: flex;
  gap: 8px;
}

.group-picker label {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 750;
}

.group-picker select {
  background: var(--surface-strong);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font: inherit;
  font-weight: 800;
  min-height: 38px;
  padding: 0 10px;
}

.brand-caption {
  display: block;
  font-size: 0.78rem;
  margin-top: 2px;
}

.header-actions {
  align-items: center;
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  min-width: 0;
}

nav {
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  gap: 4px;
  min-width: 0;
  padding: 4px;
}

nav button,
.quick-link,
.theme-toggle,
.menu-toggle,
.footer-game,
.footer-admin {
  border-radius: 8px;
  min-height: 42px;
}

nav button {
  align-items: center;
  background: transparent;
  border: 0;
  color: var(--muted);
  cursor: pointer;
  display: inline-flex;
  gap: 8px;
  justify-content: center;
  font-size: 0.9rem;
  font-weight: 750;
  padding: 0 16px;
}

nav button:hover:not(.active) {
  background: var(--accent-soft);
  color: var(--accent-strong);
}

nav button.active {
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 30%, transparent);
}

.quick-links {
  align-items: center;
  display: flex;
  gap: 8px;
  min-width: 0;
}

.quick-link {
  align-items: center;
  background: var(--surface-strong);
  border: 1px solid var(--border);
  color: var(--text);
  display: inline-flex;
  gap: 8px;
  font-size: 0.88rem;
  font-weight: 750;
  justify-content: center;
  padding: 0 12px;
  text-decoration: none;
  white-space: nowrap;
}

.quick-link.admin-link { color: var(--muted); }
.quick-link.download-link {
  border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
}
.quick-link:hover {
  border-color: var(--accent);
  color: var(--accent-strong);
}

.quick-link [data-lucide] {
  height: 18px;
  width: 18px;
}

.theme-toggle {
  align-items: center;
  background: var(--surface-strong);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  gap: 10px;
  padding: 0 12px;
}

.theme-toggle [data-lucide] {
  height: 18px;
  width: 18px;
}

.menu-toggle {
  align-items: center;
  background: var(--accent);
  border: 1px solid var(--accent);
  color: #ffffff;
  cursor: pointer;
  display: none;
  gap: 8px;
  justify-content: center;
  padding: 0 12px;
}

.menu-toggle [data-lucide] {
  height: 19px;
  width: 19px;
}

.mobile-menu {
  background: var(--surface-strong);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: none;
  gap: 8px;
  grid-column: 1 / -1;
  padding: 8px;
}

.mobile-menu[hidden] {
  display: none;
}

.mobile-menu-item {
  align-items: center;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  gap: 12px;
  min-height: 58px;
  padding: 10px 12px;
  text-align: left;
  text-decoration: none;
}

.mobile-menu-item [data-lucide] {
  color: var(--accent-strong);
  flex: 0 0 auto;
  height: 22px;
  width: 22px;
}

.mobile-menu-item strong,
.mobile-menu-item small {
  display: block;
}

.mobile-menu-item small {
  color: var(--muted);
  font-size: 0.82rem;
  margin-top: 2px;
}

.toggle-track {
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  display: inline-flex;
  height: 22px;
  padding: 2px;
  width: 40px;
}

.toggle-thumb {
  background: var(--accent);
  border-radius: 50%;
  height: 16px;
  transition: transform 0.2s ease;
  width: 16px;
}

[data-theme="dark"] .toggle-thumb { transform: translateX(16px); }

main { padding-top: 16px; }

.hero-panel {
  display: grid;
  gap: 18px;
  grid-template-columns: 1fr;
  margin-bottom: 20px;
  scroll-margin-top: 112px;
}

.live-card,
.screen-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.eyebrow {
  font-size: 0.78rem;
  font-weight: 850;
  margin-bottom: 12px;
  text-transform: uppercase;
}

h1 {
  font-size: clamp(2.35rem, 6vw, 5.6rem);
  letter-spacing: 0;
  line-height: 0.95;
  max-width: 960px;
}

.live-card {
  align-content: start;
  align-items: start;
  display: grid;
  gap: 14px;
  grid-template-columns: minmax(220px, 0.65fr) minmax(320px, 1.35fr);
  padding: 14px;
}

.live-card > div {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.live-card:has(#status:empty) {
  grid-template-columns: 1fr;
}

.mini-label,
.status-label,
.week-label {
  align-items: center;
  color: var(--muted);
  display: inline-flex;
  gap: 7px;
  font-size: 0.75rem;
  font-weight: 850;
  text-transform: uppercase;
}

.live-card .mini-label {
  margin-bottom: 10px;
}

#clock,
#week-range,
#status {
  align-items: center;
  background: var(--surface-strong);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  height: 48px;
  overflow: hidden;
  padding: 8px 12px;
}

#clock {
  flex: 1;
  font-size: 0.96rem;
  font-weight: 800;
  min-height: 56px;
}
#week-range { color: var(--accent-strong); font-size: 0.82rem; font-weight: 750; line-height: 1.15; }

#status {
  align-content: center;
  border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border));
  display: grid;
  gap: 4px;
  height: auto;
  justify-content: stretch;
  min-height: 56px;
  overflow: visible;
}

#status:empty { display: none; }
.status-summary {
  align-items: center;
  display: grid;
  gap: 3px 12px;
  grid-template-columns: minmax(0, 1fr) auto;
  width: 100%;
}

.status-summary .status-label {
  line-height: 1.15;
  white-space: nowrap;
}

.status-main {
  color: var(--text);
  font-size: 0.9rem;
  font-weight: 850;
  grid-column: 1 / -1;
  line-height: 1.2;
  min-width: 0;
}

.status-main .time-left {
  color: var(--yellow);
  font-weight: 900;
  white-space: normal;
}

.status-meta {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 650;
  line-height: 1.2;
  text-align: right;
  white-space: nowrap;
}

.status-pair { font-size: 1.1rem; font-weight: 850; line-height: 1.15; }
.status-pair .room { color: var(--accent-strong); display: inline-block; font-size: 0.84rem; font-weight: 750; margin-left: 8px; }
.status-elapsed { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }
.progress-wrap { background: var(--surface-muted); border-radius: 999px; height: 8px; margin-top: 12px; overflow: hidden; }
.progress-bar { background: linear-gradient(90deg, var(--accent), var(--blue)); border-radius: inherit; height: 100%; transition: width 1s linear; }
.status-current { margin-bottom: 14px; }
.status-next { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }
.status-next-text { color: var(--muted); font-size: 0.95rem; }
.status-next-text strong { color: var(--text); }
.status-next-text .time-left { color: var(--yellow); font-weight: 800; }
.status-free {
  align-items: center;
  color: var(--accent-strong);
  display: flex;
  font-size: 0.84rem;
  font-weight: 800;
  justify-content: center;
  line-height: 1.2;
  min-height: 21px;
  text-align: center;
  white-space: nowrap;
}

.screen-panel {
  padding: clamp(16px, 2.4vw, 24px);
  scroll-margin-top: 112px;
}

.section-title {
  align-items: end;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 16px;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 14px;
}

.section-kicker {
  align-items: center;
  display: inline-flex;
  gap: 8px;
  margin-bottom: 10px;
}

.section-kicker [data-lucide],
.inline-icon {
  color: var(--accent-strong);
  height: 18px;
  width: 18px;
}

.section-title h2,
#section-hw h1 {
  font-size: clamp(1.5rem, 3vw, 2.4rem);
  line-height: 1;
}

.section-title p,
.hw-subtitle {
  font-size: 0.92rem;
  line-height: 1.5;
  max-width: 560px;
}

.week {
  align-items: start;
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
}

.day,
.hw-day {
  background: var(--surface-strong);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-width: 0;
  overflow: hidden;
}

.day.today,
.hw-day.today {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow);
}

.day-header,
.hw-day-header {
  align-items: center;
  cursor: pointer;
  display: flex;
  font-size: 0.98rem;
  font-weight: 850;
  justify-content: space-between;
  min-height: 72px;
  padding: 14px 16px;
  user-select: none;
}

.day-header.mon,
.hw-day-header.mon { background: var(--surface-muted); color: var(--text); }
.day-header.tue,
.hw-day-header.tue { background: var(--surface-muted); color: var(--text); }
.day-header.wed,
.hw-day-header.wed { background: var(--surface-muted); color: var(--text); }
.day-header.thu,
.hw-day-header.thu { background: var(--surface-muted); color: var(--text); }
.day-header.fri,
.hw-day-header.fri,
.day-header.sat,
.hw-day-header.sat { background: var(--surface-muted); color: var(--text); }

.day-name-wrap { display: flex; flex-direction: column; gap: 4px; }
.day-date { color: var(--muted); font-size: 0.78rem; font-weight: 650; }
.chevron { color: var(--muted); display: none; font-size: 0.75rem; transition: transform 0.25s ease; }

.lesson,
.hw-item {
  border-bottom: 1px solid var(--border);
  padding: 16px;
}

.lesson:last-child,
.hw-item:last-child { border-bottom: none; }

.lesson-meta {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 10px;
  margin-top: 12px;
}

.lesson-time { font-size: 0.82rem; }
.lesson-name,
.hw-subject { color: var(--text); font-size: 1rem; font-weight: 850; }
.lesson-title {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.lesson-name { line-height: 1.25; }
.lesson-room { font-size: 0.84rem; }
.lesson-time,
.lesson-room,
.hw-subject,
.hw-text {
  align-items: center;
  display: flex;
  gap: 7px;
}
.lesson-time,
.lesson-room {
  background: color-mix(in srgb, var(--surface-muted) 72%, transparent);
  border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
  border-radius: 8px;
  min-width: 0;
  min-height: 34px;
  padding: 6px 9px;
}
.lesson.active {
  background: color-mix(in srgb, var(--current-soft) 76%, var(--surface-strong));
  border-left: 4px solid var(--current);
  padding-left: 12px;
}

.badge-now {
  background: color-mix(in srgb, var(--current) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--current) 46%, transparent);
  border-radius: 999px;
  color: var(--current-strong);
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 900;
  line-height: 1;
  padding: 6px 8px;
}

.no-classes { font-size: 0.88rem; padding: 28px 16px; text-align: center; }

.day-body {
  display: grid;
  grid-template-rows: 1fr;
}

.day-body-inner {
  min-height: 0;
  overflow: hidden;
}

.weeks-hw {
  align-items: start;
  display: grid;
  gap: 18px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.week-label {
  margin-bottom: 12px;
  text-align: center;
}

.hw-day { margin-bottom: 12px; }
.hw-day.past { opacity: 0.52; }
.hw-day-badge {
  background: color-mix(in srgb, var(--accent) 22%, transparent);
  border-radius: 999px;
  color: var(--accent-strong);
  flex-shrink: 0;
  font-size: 0.78rem;
  font-weight: 900;
  padding: 3px 10px;
}
.hw-text { font-size: 0.9rem; line-height: 1.55; margin-top: 4px; }
.no-hw { font-size: 0.86rem; padding: 16px; text-align: center; }
#hw-loading { color: var(--accent-strong); font-size: 0.95rem; padding: 40px 20px; text-align: center; }
#hw-error {
  background: var(--surface-strong);
  border: 1px solid color-mix(in srgb, #ef4444 40%, var(--border));
  border-radius: 8px;
  color: #ef4444;
  display: none;
  font-size: 0.9rem;
  margin: 20px auto;
  max-width: 420px;
  padding: 18px;
  text-align: center;
}

footer {
  align-items: center;
  display: none;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
}

.footer-game,
.footer-admin {
  align-items: center;
  border: 1px solid var(--border);
  color: var(--text);
  display: inline-flex;
  gap: 8px;
  font-size: 0.9rem;
  font-weight: 750;
  justify-content: center;
  padding: 0 18px;
  text-decoration: none;
}

.footer-game { background: var(--surface-strong); }
.footer-admin { color: var(--muted); }
.footer-game:hover,
.footer-admin:hover {
  border-color: var(--accent);
  color: var(--accent-strong);
}

@media (max-width: 1100px) {
  .app-header { grid-template-columns: minmax(180px, 1fr); }
  .header-actions {
    align-items: stretch;
    justify-content: space-between;
  }
  nav { flex: 1 1 320px; }
  .quick-links { flex: 1 1 320px; flex-wrap: wrap; }
  .theme-toggle { margin-left: auto; }
  .live-card { grid-template-columns: minmax(240px, 0.75fr) minmax(0, 1.25fr); }
  .week { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (min-width: 1101px) and (max-width: 1199px) {
  .week { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (min-width: 1000px) and (max-width: 1100px) {
  .week { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (min-width: 1200px) and (max-width: 1279px) {
  .week { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (min-width: 1280px) {
  .week { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}

@media (min-width: 1101px) and (max-width: 1279px) {
  .app-header {
    grid-template-columns: minmax(200px, auto) minmax(0, 1fr) 44px;
  }
  .header-actions {
    grid-column: 2;
    grid-row: 1;
  }
  .quick-links {
    flex: 0 0 auto;
    flex-wrap: nowrap;
  }
  .quick-links .quick-link:not(.download-link) {
    display: none;
  }
  .menu-toggle {
    align-self: stretch;
    display: inline-flex;
    grid-column: 3;
    grid-row: 1;
    min-height: 44px;
    padding: 0;
    width: 44px;
  }
  .menu-toggle span {
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    height: 1px;
    overflow: hidden;
    position: absolute;
    white-space: nowrap;
    width: 1px;
  }
  .mobile-menu {
    display: grid;
  }
}

@media (max-width: 1100px) {
  .app-header,
  .live-card,
  .weeks-hw { grid-template-columns: 1fr; }
  .week { grid-template-columns: 1fr; }
  .header-actions { flex-wrap: wrap; }
  .quick-links,
  nav { flex: 1 1 100%; }
  .theme-toggle { margin-left: 0; }
  #clock,
  #status { min-height: 56px; }
  .status-next {
    margin-top: 12px;
    padding-top: 12px;
  }
}

@media (max-width: 1100px) {
  .app-shell { padding: 12px 12px 28px; }
  .app-header {
    gap: 10px;
    grid-template-columns: minmax(0, 1fr) 44px;
    padding: 10px;
    top: 8px;
  }

  .brand {
    min-width: 0;
  }

  .brand-mark {
    height: 40px;
    width: 40px;
  }

  .brand-caption {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-actions,
  nav { width: 100%; }
  .header-actions {
    flex-direction: column;
    grid-column: 1 / -1;
  }

  nav button { flex: 1; padding: 0 10px; }

  .status-summary {
    grid-template-columns: 1fr;
  }

  .status-summary .status-label,
  .status-meta {
    white-space: normal;
  }

  .status-main,
  .status-meta {
    grid-column: auto;
    text-align: left;
  }

<script>
// ── Tab switching ──────────────────────────────────────────────────────────

const root = document.documentElement;
const themeToggle = document.getElementById('theme-toggle');
const themeLabel = document.getElementById('theme-label');
const mobileThemeToggle = document.getElementById('mobile-theme-toggle');
const mobileThemeLabel = document.getElementById('mobile-theme-label');
const menuToggle = document.getElementById('menu-toggle');
const mobileMenu = document.getElementById('mobile-menu');
const savedTheme = localStorage.getItem('schedule-theme');
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

setTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

themeToggle.addEventListener('click', () => {
  const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  setTheme(nextTheme);
  localStorage.setItem('schedule-theme', nextTheme);
});

mobileThemeToggle.addEventListener('click', () => {
  const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  setTheme(nextTheme);
  localStorage.setItem('schedule-theme', nextTheme);
});

menuToggle.addEventListener('click', () => {
  const isOpen = mobileMenu.hidden;
  mobileMenu.hidden = !isOpen;
  menuToggle.setAttribute('aria-expanded', String(isOpen));
  menuToggle.querySelector('[data-lucide]')?.setAttribute('data-lucide', isOpen ? 'x' : 'menu');
  refreshIcons();
});

let hwLoaded = false;

function switchTab(tab) {
  document.getElementById('section-schedule').style.display = tab === 'schedule' ? '' : 'none';
  document.getElementById('section-hw').style.display       = tab === 'hw'       ? '' : 'none';
  document.getElementById('tab-schedule').classList.toggle('active', tab === 'schedule');
  document.getElementById('tab-hw').classList.toggle('active', tab === 'hw');
  sessionStorage.setItem('tab', tab);
  mobileMenu.hidden = true;
  menuToggle.setAttribute('aria-expanded', 'false');
  menuToggle.querySelector('[data-lucide]')?.setAttribute('data-lucide', 'menu');
  if (tab === 'hw' && !hwLoaded) { hwLoaded = true; loadHw(); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  refreshIcons();
}

function setTheme(theme) {
  root.dataset.theme = theme;
  themeLabel.textContent = theme === 'dark' ? 'Темная' : 'Светлая';
  mobileThemeLabel.textContent = theme === 'dark' ? 'Темная тема' : 'Светлая тема';
  themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
  mobileThemeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
  document.getElementById('theme-icon')?.setAttribute('data-lucide', theme === 'dark' ? 'moon' : 'sun');
  document.getElementById('mobile-theme-icon')?.setAttribute('data-lucide', theme === 'dark' ? 'moon' : 'sun');
  refreshIcons();
}

function refreshIcons() {
  if (window.lucide) {
    window.lucide.createIcons();
  }
}

// ── Schedule data ──────────────────────────────────────────────────────────

const semesterStart = new Date(2026, 8, 1);
const semesterEnd = new Date(2027, 0, 30, 23, 59, 59);

const groupSchedules = {

    2: [{ time:'8:00–10:15', name:'МФА' }, { time:'11:10–13:25', name:'ФЛ' }],
    3: [{ time:'12:30–14:45', name:'ФЗ' }],
    4: [{ time:'11:10–12:40', name:'ФКС' }, { time:'16:00–18:15', name:'ФР' }],
    5: [{ time:'8:30–10:45', name:'ОФТ' }, { time:'11:10–13:25', name:'ОФХ' }],
    6: [{ time:'8:00–11:10', name:'УЭФ' }, { time:'11:30–13:45', name:'БЭ' }]
  },
  3: {
    1: [{ time:'8:30–10:45', name:'ФР' }, { time:'11:10–13:25', name:'ОФХ' }],
    2: [{ time:'8:00–11:10', name:'УЭФ' }, { time:'11:30–13:00', name:'ОФР' }],
    3: [{ time:'12:30–14:45', name:'ОФТ' }],
    4: [{ time:'8:30–10:00', name:'ФКС' }, { time:'11:10–13:25', name:'ФЗ' }, { time:'16:00–18:15', name:'ФР' }],
    5: [{ time:'8:30–10:45', name:'ИТ' }, { time:'11:10–13:25', name:'МФА' }],
    6: [{ time:'8:30–10:45', name:'ФЛ' }, { time:'11:30–13:45', name:'БЭ' }]
  }
};

const datedLessons = [
  { days:[1], time:'14:10–16:25', name:'ОФТ', room:'Я208', dates:['07.09','21.09','05.10','19.10','02.11','16.11','30.11'] },
  { days:[1], time:'14:10–16:25', name:'ОФХ', room:'Я208', dates:['14.09','28.09','12.10','26.10','09.11','23.11','07.12','14.12','21.12'] },
  { days:[1], time:'14:00–16:25', name:'ОФХ', room:'Я208', dates:['28.12'] },
  { days:[2], time:'14:40–16:25', name:'ИТ', room:'Я208', dates:['01.09','15.09','29.09','13.10','27.10','10.11','24.11','08.12','15.12','22.12'] },
  { days:[2], time:'14:00–15:25', name:'ИТ', room:'Я208', dates:['29.12'] },
  { days:[2], time:'14:40–16:25', name:'ФЗ', room:'Я208', dates:['08.09','22.09','06.10','20.10','03.11','17.11'] },
  { days:[2], time:'14:40–15:25', name:'ФЗ', room:'Я208', dates:['01.12'] },
  { days:[3], time:'8:00–10:25', name:'УЭФ', room:'Я208', dates:['02.09','09.09','16.09','23.09','30.09','07.10','14.10','21.10','11.11','18.11','02.12','16.12','23.12','13.01'] },
  { days:[3], time:'8:00–10:25', name:'ФЗ', room:'Я208', dates:['28.10','25.11','09.12','30.12'] },
  { days:[3], time:'9:45–11:15', name:'ФР', room:'Я208', dates:['02.09','16.09','30.09','14.10','28.10','11.11','25.11','02.12','16.12'] },
  { days:[3], groups:[1,2], time:'9:45–11:15', name:'МКвФ', room:'Я208', dates:['09.09','23.09','07.10','21.10','18.11','09.12','23.12'] },
  { days:[3], groups:[3], time:'9:45–11:15', name:'ОФР', room:'Укк', dates:['09.09','23.09','07.10','21.10','18.11','09.12','23.12'] },
  { days:[4], time:'14:10–16:25', name:'МФА', room:'Я208', dates:['03.09','10.09','17.09','01.10','08.10','15.10','29.10','05.11','12.11','26.11'] },
  { days:[4], time:'14:10–14:55', name:'МФА', room:'Я208', dates:['03.12'] },
  { days:[4], time:'14:10–16:25', name:'ОФТ', room:'Я208', dates:['24.09','22.10','10.12'] },
  { days:[4], time:'14:10–16:25', name:'ФР', room:'Я208', dates:['19.11'] },
  { days:[5], time:'14:10–16:25', name:'ФЛ', room:'Я208', dates:['04.09','11.09','18.09','25.09','02.10','09.10','16.10','23.10','30.10','06.11'] },
  { days:[5], time:'14:10–14:55', name:'ФЛ', room:'Я208', dates:['13.11'] },
  { days:[6], time:'13:40–16:05', name:'БЭ', room:'Я208', dates:['05.09','12.09','19.09','26.09','03.10','10.10','17.10','24.10','31.10','07.11'] },
  { days:[6], time:'13:40–14:25', name:'БЭ', room:'Я208', dates:['14.11'] }
];

const dayNames    = { 1:'Понедельник', 2:'Вторник', 3:'Среда', 4:'Четверг', 5:'Пятница', 6:'Суббота' };
const dayShortMap = { 1:'mon', 2:'tue', 3:'wed', 4:'thu', 5:'fri', 6:'sat' };
const mmNames     = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const groupSelect = document.getElementById('group-select');
const groupCookieName = 'schedule-group';

function getCookie(name) {
  const prefix = encodeURIComponent(name) + '=';
  const item = document.cookie.split('; ').find(row => row.startsWith(prefix));
  return item ? decodeURIComponent(item.slice(prefix.length)) : '';
}

function saveSelectedGroup(group) {
  const secure = location.protocol === 'https:' ? '; Secure' : '';
  document.cookie =
    encodeURIComponent(groupCookieName) + '=' + encodeURIComponent(group) +
    '; Max-Age=31536000; Path=/; SameSite=Lax' + secure;
  localStorage.setItem(groupCookieName, group);
}

const savedGroup = getCookie(groupCookieName) || localStorage.getItem(groupCookieName);
let selectedGroup = ['1','2','3'].includes(savedGroup) ? savedGroup : '1';
groupSelect.value = selectedGroup;
saveSelectedGroup(selectedGroup);
groupSelect.addEventListener('change', () => {
  selectedGroup = groupSelect.value;
  saveSelectedGroup(selectedGroup);
  render();
});

function fmtDateShort(d) {
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0');
}

function getDisplayWeekMonday(now) {
  if (now < semesterStart) {
    const firstWeek = new Date(semesterStart);
    firstWeek.setDate(firstWeek.getDate() - ((firstWeek.getDay() + 6) % 7));
    firstWeek.setHours(0,0,0,0);
    return firstWeek;
  }
  const dow = now.getDay();
  const d = new Date(now);
  if (dow === 0) d.setDate(d.getDate() + 1);
  else d.setDate(d.getDate() - (dow - 1));
  d.setHours(0,0,0,0);
  return d;
}

function buildWeekSchedule(now) {
  const monday = getDisplayWeekMonday(now);
  const week = [];
  for (let i = 0; i < 6; i++) {
    const date = new Date(monday);
    date.setDate(monday.getDate() + i);
    const dayIdx = i + 1;
    const dateStr = fmtDateShort(date);
    const isSemester = date >= semesterStart && date <= semesterEnd;
    const lessons = isSemester
      ? (groupSchedules[selectedGroup][dayIdx] || []).map(l => ({ ...l, room: l.room || '—' }))
      : [];
    if (isSemester) {
      datedLessons
        .filter(l => l.days.includes(dayIdx) && l.dates.includes(dateStr) && (!l.groups || l.groups.includes(Number(selectedGroup))))
        .forEach(l => lessons.push({ time:l.time, name:l.name, room:l.room || '—' }));
    }
    lessons.sort((a, b) =>
      parseTime(a.time.replace(/\u2013/g,'-').split('-')[0].trim()) -
      parseTime(b.time.replace(/\u2013/g,'-').split('-')[0].trim())
    );
    week.push({
      day: dayNames[dayIdx], short: dayShortMap[dayIdx], idx: dayIdx, date,
      dateLabel: date.getDate() + ' ' + mmNames[date.getMonth()], lessons
    });
  }
  return week;
}

function parseTime(s) { const [h,m] = s.split(':').map(Number); return h*60+m; }
function getRange(timeStr) {
  const parts = timeStr.replace(/\u2013/g,'-').split('-');
  return { start: parseTime(parts[0].trim()), end: parseTime(parts[1].trim()) };
}
function plural(n, one, few, many) {
  const a = Math.abs(n)%100, b = a%10;
  if (a>10&&a<20) return many;
  if (b>1&&b<5) return few;
  if (b===1) return one;
  return many;
}
function fmtMin(m) {
  const h = Math.floor(m/60), mm = m%60;
  let s = '';
  if (h>0) s += h+' '+plural(h,'час','часа','часов');
  if (mm>0) s += (s?' ':'')+mm+' '+plural(mm,'минуту','минуты','минут');
  return s || '< 1 минуты';
}

function renderStatus(todayData, nowMin) {
  const el = document.getElementById('status');
  if (!todayData || !todayData.lessons.length) { el.innerHTML = ''; return; }
  const lessons = todayData.lessons;
  let current = null, next = null;
  for (let i = 0; i < lessons.length; i++) {
    const r = getRange(lessons[i].time);
    if (nowMin >= r.start && nowMin < r.end) current = { ...lessons[i], ...r, idx: i };
    if (!next && nowMin < r.start) next = { ...lessons[i], ...r, idx: i };
  }
  const lastRange = getRange(lessons[lessons.length-1].time);
  if (!current && nowMin >= lastRange.end) {
    el.innerHTML = '<div class="status-free">Пары на сегодня закончились</div>'; return;
  }
  const firstRange = getRange(lessons[0].time);
  if (!current && nowMin < firstRange.start) {
    el.innerHTML = `
      <div class="status-summary">
        <div class="status-label">Первая пара</div>
        <div class="status-meta">${lessons[0].time} / ${lessons[0].room}</div>
        <div class="status-main">${lessons[0].name} <span class="time-left">через ${fmtMin(firstRange.start-nowMin)}</span></div>
      </div>`;
    return;
  }
  let html = '';
  if (current) {
    const elapsed = nowMin-current.start, total = current.end-current.start;
    const pct = Math.min(100, Math.round(elapsed/total*100));
    html += `
      <div class="status-current">
        <div class="status-label">Сейчас идет</div>
        <div class="status-pair">${current.name}<span class="room">${current.room}</span></div>
        <div class="status-elapsed">Прошло ${fmtMin(elapsed)} / осталось ${fmtMin(total-elapsed)}</div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      </div>`;
    if (!next) {
      for (let i = current.idx+1; i < lessons.length; i++) {
        const r = getRange(lessons[i].time);
        if (nowMin < r.start) { next = { ...lessons[i], ...r }; break; }
      }
    }
  }
  if (next) {
    html += `
      <div class="status-next">
        <div class="status-summary">
          <div class="status-label">Следующая</div>
          <div class="status-meta">${next.time} / ${next.room}</div>
          <div class="status-main">${next.name} <span class="time-left">через ${fmtMin(next.start-nowMin)}</span></div>
        </div>
      </div>`;
  } else if (current) {
    html += '<div class="status-next"><div class="status-free">Последняя пара на сегодня</div></div>';
  }
  el.innerHTML = html;
}

function render() {
  const now = new Date();
  const todayIdx = now.getDay();
  const nowMin = now.getHours()*60+now.getMinutes();
  const isWeekend = todayIdx === 0;
  const canCollapseDays = window.matchMedia('(max-width: 900px)').matches;

  const week = buildWeekSchedule(now);
  const weekEl = document.getElementById('week');
  weekEl.innerHTML = '';

  const isSameDate = (a, b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();
  const todayData = isWeekend ? null : week.find(d => isSameDate(d.date, now));
  renderStatus(todayData, nowMin);

  document.getElementById('clock').textContent =
    now.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' }) +
    ', ' + now.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });

  week.forEach(d => {
    const isToday = !isWeekend && isSameDate(d.date, now);
    const dayEl = document.createElement('div');
    dayEl.className = 'day' + (isToday ? ' today' : '');

    const hdr = document.createElement('div');
    hdr.className = 'day-header ' + d.short;
    hdr.innerHTML = `
      <div class="day-name-wrap">
        <span>${d.day}</span>
        <span class="day-date">${d.dateLabel}</span>
      </div>
      <span class="chevron">▼</span>`;
    dayEl.appendChild(hdr);

    const bodyWrap = document.createElement('div');
    bodyWrap.className = 'day-body';
    const bodyInner = document.createElement('div');
    bodyInner.className = 'day-body-inner';
    bodyWrap.appendChild(bodyInner);

    if (!d.lessons.length) {
      const nc = document.createElement('div');
      nc.className = 'no-classes';
      nc.textContent = 'Нет пар';
      bodyInner.appendChild(nc);
    } else {
      d.lessons.forEach(l => {
        const r = getRange(l.time);
        const active = isToday && nowMin >= r.start && nowMin < r.end;
        const div = document.createElement('div');
        div.className = 'lesson' + (active ? ' active' : '');
        div.innerHTML = `
          <div class="lesson-title">
            <div class="lesson-name">${l.name}</div>
            ${active ? '<span class="badge-now">СЕЙЧАС</span>' : ''}
          </div>
          <div class="lesson-meta">
            <div class="lesson-time"><i class="inline-icon" data-lucide="clock" aria-hidden="true"></i>${l.time}</div>
            <div class="lesson-room"><i class="inline-icon" data-lucide="map-pin" aria-hidden="true"></i>${l.room}</div>
          </div>`;
        bodyInner.appendChild(div);
      });
    }

    dayEl.appendChild(bodyWrap);

    if (canCollapseDays) {
      if (collapsedDaySet.has(d.short)) dayEl.classList.add('collapsed');
      hdr.addEventListener('click', () => {
        dayEl.classList.toggle('collapsed');
        if (dayEl.classList.contains('collapsed')) collapsedDaySet.add(d.short);
        else collapsedDaySet.delete(d.short);
      });
    }
    weekEl.appendChild(dayEl);
  });
  refreshIcons();
}

const todayShort = dayShortMap[new Date().getDay()];
const collapsedDaySet = new Set(['mon','tue','wed','thu','fri','sat'].filter((day) => day !== todayShort));

render();
setInterval(render, 10000);

// ── Homework ──────────────────────────────────────────────────────────────

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwuSrAb4aoI79yMefk-bOemFjprKlbZd1yP7f1KgDr3Clc0aUTvjPEXDA1WTojnig9bdQ/exec';
const HW_COLORS  = { 1:'mon', 2:'tue', 3:'wed', 4:'thu', 5:'fri' };
const HW_WDAYS   = { 1:'Понедельник', 2:'Вторник', 3:'Среда', 4:'Четверг', 5:'Пятница' };

function toISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseToISO(str) {
  if (!str) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  const d = new Date(str);
  return isNaN(d.getTime()) ? str : toISO(d);
}
function fmtFull(d) {
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}
function getMonday(d) {
  const d2 = new Date(d);
  const wd = d2.getDay();
  d2.setDate(d2.getDate() + (wd===0 ? 1 : wd===6 ? 2 : -(wd-1)));
  d2.setHours(0,0,0,0);
  return d2;
}

function buildHwWeek(monday, allHw, today, label) {
  const section = document.createElement('div');

  const lbl = document.createElement('div');
  lbl.className = 'week-label';
  const fri = new Date(monday); fri.setDate(monday.getDate() + 4);
  lbl.textContent = label + '  ·  ' + fmtFull(monday) + ' – ' + fmtFull(fri);
  section.appendChild(lbl);

  for (let i = 0; i < 5; i++) {
    const date = new Date(monday);
    date.setDate(monday.getDate() + i);
    const iso    = toISO(date);
    const wd     = i + 1;
    const dayHw  = allHw.filter(h => h.deadline === iso);
    const isToday = iso === toISO(today);
    const isPast  = date < today;

    const dayEl = document.createElement('div');
    dayEl.className = 'hw-day' + (isToday ? ' today' : '') + (isPast ? ' past' : '');

    const hdr = document.createElement('div');
    hdr.className = 'hw-day-header ' + HW_COLORS[wd];
    hdr.innerHTML = `
      <div class="day-name-wrap">
        <span>${HW_WDAYS[wd]}</span>
        <span class="day-date">${fmtFull(date)}</span>
      </div>
      ${dayHw.length ? `<span class="hw-day-badge">${dayHw.length}</span>` : ''}`;

    const body = document.createElement('div');
    body.className = 'hw-body';
    if (!dayHw.length) {
      body.innerHTML = '<div class="no-hw">нет заданий</div>';
    } else {
      dayHw.forEach(hw => {
        const item = document.createElement('div');
        item.className = 'hw-item';
        item.innerHTML = `
          <div class="hw-subject"><i class="inline-icon" data-lucide="book-marked" aria-hidden="true"></i>${hw.subject}</div>
          <div class="hw-text"><i class="inline-icon" data-lucide="file-text" aria-hidden="true"></i>${hw.text}</div>`;
        body.appendChild(item);
      });
    }

    dayEl.appendChild(hdr);
    dayEl.appendChild(body);
    dayEl.addEventListener('click', () => dayEl.classList.toggle('expanded'));
    section.appendChild(dayEl);
  }
  return section;
}

async function loadHw() {
  try {
    const res  = await fetch(SCRIPT_URL + '?action=list');
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'ошибка API');

    const today    = new Date(); today.setHours(0,0,0,0);
    const todayISO = toISO(today);
    const hw       = (json.data || [])
      .map(h => ({ ...h, deadline: parseToISO(h.deadline) }))
      .filter(h => h.deadline >= todayISO);

    const thisMonday = getMonday(today);
    const nextMonday = new Date(thisMonday); nextMonday.setDate(thisMonday.getDate() + 7);
    const nextFri    = new Date(nextMonday);  nextFri.setDate(nextMonday.getDate() + 4);

    document.getElementById('hw-loading').style.display = 'none';
    document.getElementById('hw-subtitle').textContent  =
      fmtFull(thisMonday) + ' – ' + fmtFull(nextFri);

    const weeksEl = document.getElementById('weeks-hw');
    weeksEl.innerHTML = '';
    weeksEl.style.display = '';
    weeksEl.appendChild(buildHwWeek(thisMonday, hw, today, 'Текущая неделя'));
    weeksEl.appendChild(buildHwWeek(nextMonday, hw, today, 'Следующая неделя'));
    refreshIcons();

  } catch (e) {
    document.getElementById('hw-loading').style.display = 'none';
    const err = document.getElementById('hw-error');
    err.textContent = 'Не удалось загрузить: ' + e.message;
    err.style.display = '';
  }
}

hwLoaded = true;
loadHw();

const savedTab = sessionStorage.getItem('tab');
if (savedTab === 'hw') switchTab('hw');
